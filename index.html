    <title>Practica 1 - HTML</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .card {

            letter-spacing: 1px;
        }
        p {

            letter-spacing: 2px;
